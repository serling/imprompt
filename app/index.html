<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9ebef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121419" media="(prefers-color-scheme: dark)">
<meta name="description" content="Short improv prompts for round-robin scenes. One prompt at a time.">
<title>Imprompt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Base: full-height page that respects phone safe areas. */
*, *::before, *::after { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
/* Layout: one-screen stage — a cue line on top, the prompt card filling the middle, controls pinned to the thumb zone. */
:root {
  --bg: #e9ebef;
  --card: #fbfbfc;
  --fg: #1a1d26;
  --muted: #5d6273;
  --line: #cfd3dc;
  --accent: #b5410f;
  --accent-fg: #ffffff;
  --duo: #1f4f8a;
  --scene: #2e6a3f;
  --buzz: #b3261e;
  --buzz-fg: #ffffff;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121419; --card: #1c1f27; --fg: #eceae5; --muted: #9a9fae; --line: #2f3340;
    --accent: #f08a4b; --accent-fg: #1a0d05; --duo: #7fb0f0; --scene: #86c99a; --buzz: #ff7b6e; --buzz-fg: #1f0806; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121419; --card: #1c1f27; --fg: #eceae5; --muted: #9a9fae; --line: #2f3340;
  --accent: #f08a4b; --accent-fg: #1a0d05; --duo: #7fb0f0; --scene: #86c99a; --buzz: #ff7b6e; --buzz-fg: #1f0806; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--display);
  display: flex; flex-direction: column; gap: 14px;
  padding-inline: 16px; padding-block: 14px 18px; box-sizing: border-box;
  max-width: 560px; margin-inline: auto;
}
.cue {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap;
  font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.cue-left { display: flex; align-items: baseline; gap: 10px; }
/* Reset brings every prompt back on this device. Two taps: the first asks, in place. */
#reset {
  font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--muted); background: none;
  border: 1px solid var(--line); border-radius: 4px; padding: 2px 7px;
}
#reset.armed { color: var(--buzz-fg); background: var(--buzz); border-color: var(--buzz); }
.card {
  flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 18px;
  background: var(--card); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 6px 6px;
  padding: 28px 22px 64px; overflow-y: auto;
}
/* The card and its mode tabs are one panel. */
.stage { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
.who {
  font-family: var(--mono); font-size: 13px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase;
  color: var(--accent);
}
.who.duo { color: var(--duo); }
.who.scene { color: var(--scene); }
.text {
  font-size: clamp(28px, 8vw, 40px); line-height: 1.15; font-weight: 700; margin: 0;
  text-wrap: balance; letter-spacing: -0.01em;
}
/* A called-back character stands out inside the prompt. */
.text .callback { color: var(--accent); font-style: italic; }
.text.duo .callback { color: var(--duo); }
/* Mode switch: tabs on top of the card. Rapid fire = podium round robin; Scenes = deliberate scenes.
   The open tab shares the card's surface; the other sits back and closes the card's top edge. */
.modes { display: grid; grid-template-columns: 1fr 1fr; }
.modes button {
  border: 1px solid var(--line); border-radius: 6px 6px 0 0; background: var(--bg); color: var(--muted);
  padding: 13px 8px; font-family: var(--mono); font-size: 13px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase;
}
.modes button + button { border-left: 0; }
.modes button:first-child { border-right: 0; }
.modes button[aria-pressed="false"] { box-shadow: inset 0 -1px 0 var(--line); }
.modes button[aria-pressed="true"] { background: var(--card); color: var(--fg); border-bottom-color: var(--card); }
#modeRapid[aria-pressed="true"] { box-shadow: inset 0 3px 0 var(--accent); }
#modeScenes[aria-pressed="true"] { box-shadow: inset 0 3px 0 var(--scene); }
/* One tap deals: a button per player count, its person icons saying how many. Rapid fire has
   1 and 2 in blue, Scenes 2, 3 and 4 in green, then side-coaching below. */
.deal-row { grid-column: 1 / -1; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 10px; height: 88px; }
.deal { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 0; background: var(--duo); color: var(--card); }
.scenes .deal { background: var(--scene); }
.mods li .kind { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--scene); }
/* Scene setups run longer than Rapid fire prompts, and share the card with two coaching lines. */
.text.scene { font-size: clamp(24px, 6.6vw, 32px); }
.text.idle { font-weight: 500; color: var(--muted); font-size: clamp(22px, 6vw, 28px); }
.controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
button {
  font: inherit; border-radius: 6px; cursor: pointer; border: 1px solid transparent;
  -webkit-tap-highlight-color: transparent;
}
button:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: default; }
/* Person icons give the player count at a glance: one icon per player. */
.person { flex: none; }
.people { display: inline-flex; }
.people .person + .person { margin-left: -6px; }
/* While a prompt or scene plays, the player buttons give way to one row. Left, a third: the
   buzzer (a reception desk bell), which only rings: it does not end anything. Right, two thirds:
   Heighten (the next escalation step or a duo rerun, when there is one) split with Next, a new
   prompt for the same number of players. Back, below, returns to the player buttons. */
.end { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 2fr; grid-template-rows: minmax(0, 1fr); gap: 10px; height: 88px; }
/* Heighten and Next are one split button: two halves of one colour with a thin divider. With
   nothing to heighten, Next fills it. */
.go { display: flex; min-width: 0; }
.go button { flex: 1; min-width: 0; }
.end button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0; }
/* One icon box for all three, so the labels line up. */
.end button svg { width: 34px; height: 34px; }
.deal .label, .end .label { font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; }
#bigBuzz { background: var(--buzz); color: var(--buzz-fg); }
#more { background: var(--duo); color: var(--card); border-radius: 6px 0 0 6px; }
#more:disabled { display: none; }
#next { background: var(--duo); color: var(--card); }
#more:not(:disabled) + #next { border-radius: 0 6px 6px 0; border-left: 1px solid color-mix(in srgb, var(--card) 55%, transparent); }
.scenes-on #next { background: var(--scene); }
/* Bottom row while playing: Back (left) and Skip (right), both muted. */
.bottom { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; min-height: 44px; }
#back, #skip {
  display: flex; align-items: center; gap: 4px; background: none; border-color: transparent; color: var(--muted);
  font-family: var(--mono); font-size: 13px; letter-spacing: .08em; text-transform: uppercase;
}
#back { padding: 10px 12px 10px 6px; }
#skip { padding: 10px 6px 10px 12px; margin-left: auto; }
/* The card flashes when the buzzer ends a scene. */
@keyframes buzzflash { from { background: var(--accent); } to { background: var(--card); } }
.card.buzzed { animation: buzzflash .9s ease-out; }
@media (prefers-reduced-motion: reduce) { .card.buzzed { animation-duration: .01s; } }
/* Mute sits inside the card, lower right, out of the way of the play buttons. */
#mute {
  position: absolute; right: 12px; bottom: 12px; width: 44px; height: 40px; display: grid; place-items: center; padding: 0;
  background: none; color: var(--muted); border-color: var(--line);
  transition: background-color .15s, color .15s, border-color .15s, transform .08s;
}
#mute .when-muted { display: none; }
/* Muted: filled and dark, with the crossed-out speaker — readable at a glance. */
#mute[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
#mute[aria-pressed="true"] .when-muted { display: block; }
#mute[aria-pressed="true"] .when-on { display: none; }
@media (prefers-reduced-motion: no-preference) {
  button:not(:disabled) { transition: transform .08s, background-color .15s, color .15s, border-color .15s; }
  button:not(:disabled):active { transform: scale(.94); }
}
.mods { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 14px; }
.mods ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.mods li { font-size: clamp(20px, 5.5vw, 26px); font-weight: 500; line-height: 1.2; }
/* Scenes: emotion and style sit a step back from the setup, each with an inline refresh icon. */
.mods li.coach-line { font-size: clamp(19px, 5vw, 22px); color: color-mix(in srgb, var(--fg) 68%, var(--card)); }
.mods li.coach-line .kind { color: color-mix(in srgb, var(--scene) 75%, var(--card)); }
.refresh {
  display: inline-flex; vertical-align: -3px; margin-left: 2px; padding: 4px 8px; margin-block: -4px;
  background: none; border: 0; color: color-mix(in srgb, var(--scene) 75%, var(--card));
}.status { font-family: var(--mono); font-size: 11px; color: var(--muted); text-align: center; min-height: 1.4em; }
.status.warn { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) {
  .text.fresh, .mods li.fresh { animation: rise .22s ease-out; }
  @keyframes rise { from { opacity: .2; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}
</style>
</head>
<body>
<div class="cue"><span class="cue-left"><span id="cueNo">Cue —</span><button id="reset" disabled>Reset</button></span><span id="deckInfo">Loading deck…</span></div>

<div class="stage">
<div class="modes" role="group" aria-label="Mode">
  <button id="modeRapid" aria-pressed="true">Rapid fire</button>
  <button id="modeScenes" aria-pressed="false">Scenes</button>
</div>
<main class="card" id="card" aria-live="polite">
  <div class="who" id="who">Ready</div>
  <p class="text idle" id="text">Tap a player count for the next prompt.</p>
  <div class="mods" id="mods" hidden><ul id="modList"></ul></div>
</main>
  <button id="mute" aria-label="Sound on. Tap to mute." aria-pressed="false"><svg class="when-on" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><svg class="when-muted" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
</div>

<div class="controls">
  <div class="deal-row" id="rapidWrap">
    <button class="deal" data-rapid="1" disabled aria-label="New scene, 1 player"><span class="people"><svg class="person" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="7" r="4.2" fill="currentColor"/><path d="M3.5 22c0-4.9 3.8-8.6 8.5-8.6s8.5 3.7 8.5 8.6z" fill="currentColor"/></svg></span><span class="label">1 player</span></button>
    <button class="deal" data-rapid="2" disabled aria-label="New scene, 2 players"><span class="people"><svg class="person" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="7" r="4.2" fill="currentColor"/><path d="M3.5 22c0-4.9 3.8-8.6 8.5-8.6s8.5 3.7 8.5 8.6z" fill="currentColor"/></svg><svg class="person" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="7" r="4.2" fill="currentColor"/><path d="M3.5 22c0-4.9 3.8-8.6 8.5-8.6s8.5 3.7 8.5 8.6z" fill="currentColor"/></svg></span><span class="label">2 players</span></button>
  </div>
  <div class="end" id="endWrap" hidden>
    <button id="bigBuzz" aria-label="Buzzer"><svg viewBox="0 0 24 24" width="36" height="36" aria-hidden="true"><rect x="9.4" y="4.2" width="5.2" height="1.8" rx=".9" fill="currentColor"/><rect x="11.2" y="5.6" width="1.6" height="2.6" fill="currentColor"/><path d="M4.6 16.6a7.4 7.4 0 0 1 14.8 0z" fill="currentColor"/><rect x="2.8" y="17.6" width="18.4" height="2.4" rx="1.2" fill="currentColor"/></svg><span class="label">Buzzer</span></button>
    <div class="go">
      <button id="more" disabled><svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><mask id="dialCut"><rect width="24" height="24" fill="#fff"/><path d="M12.49 13.24L14.95 14.96" stroke="#000" stroke-width="1.9" stroke-linecap="round"/></mask><circle cx="12" cy="12.9" r="6.2" fill="currentColor" mask="url(#dialCut)"/><circle cx="4.93" cy="19.97" r="0.60" fill="currentColor"/><circle cx="2.00" cy="12.90" r="0.76" fill="currentColor"/><circle cx="4.93" cy="5.83" r="0.92" fill="currentColor"/><circle cx="12.00" cy="2.90" r="1.08" fill="currentColor"/><circle cx="19.07" cy="5.83" r="1.24" fill="currentColor"/><circle cx="22.00" cy="12.90" r="1.40" fill="currentColor"/><circle cx="19.07" cy="19.97" r="1.56" fill="currentColor"/></svg><span class="label">Heighten</span></button>
      <button id="next" aria-label="Next: a new prompt for the same number of players"><svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><path d="M4.5 12h14.5M13 5.5l6.5 6.5-6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="label">Next</span></button>
    </div>
  </div>
  <div class="deal-row scenes" id="scenesWrap" hidden>
    <button class="deal" data-players="2" disabled aria-label="New scene, 2 players"><span class="people"><svg class="person" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="7" r="4.2" fill="currentColor"/><path d="M3.5 22c0-4.9 3.8-8.6 8.5-8.6s8.5 3.7 8.5 8.6z" fill="currentColor"/></svg><svg class="person" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="7" r="4.2" fill="currentColor"/><path d="M3.5 22c0-4.9 3.8-8.6 8.5-8.6s8.5 3.7 8.5 8.6z" fill="currentColor"/></svg></span><span class="label">2 players</span></button>
    <button class="deal" data-players="3" disabled aria-label="New scene, 3 players"><span class="people"><svg class="person" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="7" r="4.2" fill="currentColor"/><path d="M3.5 22c0-4.9 3.8-8.6 8.5-8.6s8.5 3.7 8.5 8.6z" fill="currentColor"/></svg><svg class="person" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="7" r="4.2" fill="currentColor"/><path d="M3.5 22c0-4.9 3.8-8.6 8.5-8.6s8.5 3.7 8.5 8.6z" fill="currentColor"/></svg><svg class="person" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="7" r="4.2" fill="currentColor"/><path d="M3.5 22c0-4.9 3.8-8.6 8.5-8.6s8.5 3.7 8.5 8.6z" fill="currentColor"/></svg></span><span class="label">3 players</span></button>
    <button class="deal" data-players="4" disabled aria-label="New scene, 4 players"><span class="people"><svg class="person" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="7" r="4.2" fill="currentColor"/><path d="M3.5 22c0-4.9 3.8-8.6 8.5-8.6s8.5 3.7 8.5 8.6z" fill="currentColor"/></svg><svg class="person" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="7" r="4.2" fill="currentColor"/><path d="M3.5 22c0-4.9 3.8-8.6 8.5-8.6s8.5 3.7 8.5 8.6z" fill="currentColor"/></svg><svg class="person" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="7" r="4.2" fill="currentColor"/><path d="M3.5 22c0-4.9 3.8-8.6 8.5-8.6s8.5 3.7 8.5 8.6z" fill="currentColor"/></svg><svg class="person" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="7" r="4.2" fill="currentColor"/><path d="M3.5 22c0-4.9 3.8-8.6 8.5-8.6s8.5 3.7 8.5 8.6z" fill="currentColor"/></svg></span><span class="label">4 players</span></button>
  </div>
  <div class="bottom">
    <button id="back" hidden><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>
    <button id="skip" hidden>Skip<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</div>
<div class="status" id="status"></div>
<script src="player.js"></script>
</body>
</html>
