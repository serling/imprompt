<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9ebef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121419" media="(prefers-color-scheme: dark)">
<meta name="description" content="Short improv prompts for round-robin scenes. One prompt at a time.">
<title>Imprompt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
:root {
  --bg: #e9ebef;
  --card: #fbfbfc;
  --fg: #1a1d26;
  --muted: #5d6273;
  --line: #cfd3dc;
  --accent: #b5410f;
  --accent-fg: #ffffff;
  --rapid: #1f4f8a;
  --scene: #2e6a3f;
  --game: #6b3f8f;
  --buzz: #b3261e;
  --buzz-fg: #ffffff;
  --bell: #a8740f;
  --bell-fg: #ffffff;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121419; --card: #1c1f27; --fg: #eceae5; --muted: #9a9fae; --line: #2f3340;
    --accent: #f08a4b; --accent-fg: #1a0d05; --rapid: #7fb0f0; --scene: #86c99a; --game: #c7a3e6; --buzz: #ff7b6e; --buzz-fg: #1f0806; --bell: #e8b44c; --bell-fg: #1f1503; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121419; --card: #1c1f27; --fg: #eceae5; --muted: #9a9fae; --line: #2f3340;
  --accent: #f08a4b; --accent-fg: #1a0d05; --rapid: #7fb0f0; --scene: #86c99a; --game: #c7a3e6; --buzz: #ff7b6e; --buzz-fg: #1f0806; --bell: #e8b44c; --bell-fg: #1f1503; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--display);
  display: flex; flex-direction: column; gap: 14px;
  padding-inline: 16px; padding-block: 14px 18px; box-sizing: border-box;
  max-width: 560px; margin-inline: auto;
}
.card {
  flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: safe center; gap: 18px;
  background: var(--card); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 6px 6px;
  padding: 28px 22px 64px; overflow-y: auto;
}
.stage { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
.who {
  font-family: var(--mono); font-size: 13px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase;
  color: var(--accent);
}
.who.rapid { color: var(--rapid); }
.who.scene { color: var(--scene); }
.who.game { color: var(--game); }
.text {
  font-size: clamp(28px, 8vw, 40px); line-height: 1.15; font-weight: 700; margin: 0;
  text-wrap: balance; letter-spacing: -0.01em;
}
.modes { display: grid; grid-template-columns: 1fr 1fr 1fr; }
.modes button {
  border: 1px solid var(--line); border-radius: 6px 6px 0 0; background: var(--bg); color: var(--muted);
  padding: 13px 8px; font-family: var(--mono); font-size: 13px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase;
}
.modes button + button { border-left: 0; }
.modes button[aria-pressed="false"] { box-shadow: inset 0 -1px 0 var(--line); }
.modes button[aria-pressed="true"] { background: var(--card); color: var(--fg); border-bottom-color: var(--card); }
#modeRapid[aria-pressed="true"] { box-shadow: inset 0 3px 0 var(--rapid); }
#modeScenes[aria-pressed="true"] { box-shadow: inset 0 3px 0 var(--scene); }
#modeGames[aria-pressed="true"] { box-shadow: inset 0 3px 0 var(--game); }
.deal-row { grid-column: 1 / -1; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 10px; height: 88px; }
.deal { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 0; background: var(--rapid); color: var(--card); }
.scenes .deal { background: var(--scene); }
.games .deal { background: var(--game); }
.deal-row.rapid, .deal-row.scenes, .deal-row.games { grid-auto-flow: row; grid-template-columns: auto 1fr; column-gap: 24px; height: 76px; }
.sounds { display: flex; gap: 6px; }
.mods li .kind { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--scene); }
.text.scene { font-size: clamp(24px, 6.6vw, 32px); }
.text.idle { font-weight: 500; color: var(--muted); font-size: clamp(22px, 6vw, 28px); }
.controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
button {
  font: inherit; border-radius: 6px; cursor: pointer; border: 1px solid transparent;
  -webkit-tap-highlight-color: transparent;
}
button:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: default; }
.person { flex: none; }
.people { display: inline-flex; }
.people .person + .person { margin-left: -6px; }
.deal .label { font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; }
.buzz, .bell { display: grid; place-items: center; padding: 0; width: 72px; height: 100%; }
.buzz { background: var(--buzz); color: var(--buzz-fg); }
.bell { background: var(--bell); color: var(--bell-fg); }
.buzz svg, .bell svg { width: 32px; height: 32px; }
.deal svg:not(.person) { width: 28px; height: 28px; }
.group { display: flex; align-items: center; gap: 4px; height: 32px; padding: 0 4px 0 8px; margin-right: auto;
  border: 1px solid var(--line); border-radius: 6px; color: var(--muted); }
.group select { font-family: var(--mono); font-size: 13px; color: var(--fg); background: none;
  border: 0; height: 30px; padding: 0 2px; }
.picker { display: flex; justify-content: center; align-items: center; gap: 18px; margin-top: 28px; }
.card.asking .who, .card.asking .text { text-align: center; }
body.asking .modes, body.asking .tools { display: none; }
body.asking .card { border-top: 1px solid var(--line); border-radius: 6px; padding-bottom: 28px; }
.picker .host { display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--muted);
  font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
.picker .plus { font-size: 28px; font-weight: 400; color: var(--muted); }
.picker .counts { display: grid; grid-template-columns: repeat(2, 88px); gap: 10px; }
.picker .counts button { height: 52px; font-family: var(--mono); font-size: 20px; font-variant-numeric: tabular-nums;
  background: var(--bg); color: var(--fg); border-color: var(--line); }
@keyframes buzzflash { from { background: var(--accent); } to { background: var(--card); } }
.card.buzzed { animation: buzzflash .9s ease-out; }
@keyframes bellflash { from { background: color-mix(in srgb, var(--bell) 45%, var(--card)); } to { background: var(--card); } }
.card.belled { animation: bellflash .7s ease-out; }
@media (prefers-reduced-motion: reduce) { .card.buzzed, .card.belled { animation-duration: .01s; } }
.tools { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 8px; }
#timer {
  height: 40px; min-width: 44px; display: flex; align-items: center; gap: 5px;
  padding: 0 10px; background: none; color: var(--muted); border-color: var(--line);
  font-family: var(--mono); font-size: 13px; letter-spacing: .04em; font-variant-numeric: tabular-nums;
}
#timer.on { color: var(--fg); }
.bar { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 10px; }
#mute {
  width: 40px; height: 32px; display: grid; place-items: center; padding: 0;
  background: none; color: var(--muted); border-color: var(--line);
  transition: background-color .15s, color .15s, border-color .15s, transform .08s;
}
#mute .when-muted { display: none; }
#reset {
  position: relative; width: 40px; height: 32px; display: grid; place-items: center; padding: 0;
  background: none; color: var(--muted); border-color: var(--line);
}
#reset.armed { color: var(--buzz-fg); background: var(--buzz); border-color: var(--buzz); }
#reset .label {
  position: absolute; top: calc(100% + 6px); right: 0; z-index: 5; white-space: nowrap;
  padding: 5px 9px; border-radius: 4px; background: var(--buzz); color: var(--buzz-fg);
  font-family: var(--mono); font-size: 12px; letter-spacing: .04em;
}
#reset .label:empty { display: none; }
#lang {
  height: 32px; min-width: 40px; padding: 0 10px; background: none; color: var(--muted); border-color: var(--line);
  font-family: var(--mono); font-size: 13px; letter-spacing: .06em;
}
#mute[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
#mute[aria-pressed="true"] .when-muted { display: block; }
#mute[aria-pressed="true"] .when-on { display: none; }
@media (prefers-reduced-motion: no-preference) {
  button:not(:disabled) { transition: transform .08s, background-color .15s, color .15s, border-color .15s; }
  button:not(:disabled):active { transform: scale(.94); }
}
.mods { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 14px; }
.mods ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.mods li { font-size: clamp(20px, 5.5vw, 26px); font-weight: 500; line-height: 1.2; }
.mods li.coach-line { font-size: clamp(17px, 4.6vw, 20px); color: color-mix(in srgb, var(--fg) 68%, var(--card)); }
.mods li.coach-line, .game .words li { display: flex; flex-direction: column; gap: 2px; }
.mods ul, .game .words { gap: 18px; }
.mods li.coach-line .kind { color: color-mix(in srgb, var(--scene) 75%, var(--card)); }
body:not(.scenes-on) .mods li.coach-line .kind, body:not(.scenes-on) .mods .refresh { color: color-mix(in srgb, var(--rapid) 75%, var(--card)); }
.tail { white-space: nowrap; }
.say.show { text-decoration: underline dashed 1px; text-decoration-color: color-mix(in srgb, currentColor 30%, transparent);
  text-underline-offset: 5px; cursor: pointer; }
.reveal { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 20px; padding: calc(24px + env(safe-area-inset-top, 0px)) 24px
  calc(56px + env(safe-area-inset-bottom, 0px)); background: var(--card); color: var(--fg); text-align: center; cursor: pointer; }
.reveal[hidden] { display: none; }
.reveal .who { color: var(--scene); }
body.games-on .reveal .who { color: var(--game); }
.reveal p { margin: 0; max-width: 16em; font-size: clamp(32px, 9vw, 56px); font-weight: 700; line-height: 1.15;
  letter-spacing: -0.01em; text-wrap: balance; }
.reveal .hint { position: absolute; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); font-family: var(--mono);
  font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.refresh {
  display: inline-flex; vertical-align: -3px; margin-left: 2px; padding: 4px 8px; margin-block: -4px;
  background: none; border: 0; color: color-mix(in srgb, var(--scene) 75%, var(--card));
}
.text.game-name { font-size: clamp(26px, 7vw, 32px); }
.game { display: flex; flex-direction: column; gap: 12px; }
.game .summary { margin: 0; font-size: clamp(17px, 4.6vw, 20px); font-weight: 500; line-height: 1.25; }
.game ol { margin: 8px 0 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 4px;
  font-size: 15px; line-height: 1.4; color: color-mix(in srgb, var(--fg) 82%, var(--card)); }
.game ol li::marker { font-family: var(--mono); font-size: 13px; color: var(--game); }
.game .words { margin: 0; padding: 0; list-style: none;
  display: flex; flex-direction: column; gap: 18px; }
.game .words li { font-size: clamp(17px, 4.5vw, 19px); font-weight: 500; line-height: 1.2;
  color: color-mix(in srgb, var(--fg) 68%, var(--card)); }
.game .words .kind {
  font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
  color: color-mix(in srgb, var(--game) 80%, var(--card)); }
.game .refresh { color: color-mix(in srgb, var(--game) 80%, var(--card)); }
.game details { border-top: 1px solid var(--line); padding-top: 10px; font-size: 15px; line-height: 1.4; color: var(--muted); }
.game summary { cursor: pointer; font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
  color: color-mix(in srgb, var(--game) 80%, var(--card)); padding: 4px 0; }
.game details p { margin: 6px 0 0; }
.game details p.aka { margin-top: 8px; font-size: 13px; }
.status { font-family: var(--mono); font-size: 11px; color: var(--muted); text-align: center; min-height: 1.4em; }
.status.warn { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) {
  .mods li.fresh, .words li.fresh { animation: rise .22s ease-out; }
  .card.swap > :not(.tools) { animation: swap .28s cubic-bezier(.2, .7, .3, 1); }
  @keyframes swap { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
  @keyframes rise { from { opacity: .2; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}
</style>
</head>
<body>
<div class="stage">
<div class="bar">
  <label class="group" id="groupWrap" hidden><svg class="person" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="7" r="4.2" fill="currentColor"/><path d="M3.5 22c0-4.9 3.8-8.6 8.5-8.6s8.5 3.7 8.5 8.6z" fill="currentColor"/></svg><select id="group" aria-label="Players"></select></label>
  <button id="lang" aria-label="Language: English. Tap for Norwegian.">EN</button>
  <button id="mute" aria-label="Sound on. Tap to mute." aria-pressed="false"><svg class="when-on" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><svg class="when-muted" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  <button id="reset" disabled aria-label="End session"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M14 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M10 12h10M16.5 8.5 20 12l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="label"></span></button>
</div>
<div class="modes" role="group" aria-label="Mode" data-ui-aria="mode">
  <button id="modeRapid" aria-pressed="true" data-ui="rapid">Rapid fire</button>
  <button id="modeScenes" aria-pressed="false" data-ui="scenes">Scenes</button>
  <button id="modeGames" aria-pressed="false" data-ui="games">Games</button>
</div>
<main class="card" id="card" aria-live="polite">
  <div class="who" id="who">Ready</div>
  <p class="text idle" id="text">Tap a player count for the next prompt.</p>
  <div class="picker" id="picker" hidden></div>
  <div class="mods" id="mods" hidden><ul id="modList"></ul></div>
  <div class="game" id="game" hidden></div>
</main>
  <div class="tools">
  <button id="timer" aria-label="Stopwatch"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 13.5V9.5M9.5 3.5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span class="label">0:00</span></button>
  </div>
</div>

<div class="controls">
  <div class="deal-row rapid" id="rapidWrap">
    <div class="sounds"><button id="rapidBuzz" class="buzz" aria-label="Buzzer" data-ui-aria="buzzer"><svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg></button><button class="bell" aria-label="Bell" data-ui-aria="bell"><svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><rect x="9.4" y="4.2" width="5.2" height="1.8" rx=".9" fill="currentColor"/><rect x="11.2" y="5.6" width="1.6" height="2.6" fill="currentColor"/><path d="M4.6 16.6a7.4 7.4 0 0 1 14.8 0z" fill="currentColor"/><rect x="2.8" y="17.6" width="18.4" height="2.4" rx="1.2" fill="currentColor"/></svg></button></div>
    <button class="deal" id="dealRapid" disabled aria-label="New prompt" data-ui-aria="newPrompt"><svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><path d="M4.5 3.5h15a2 2 0 0 1 2 2v9.5a2 2 0 0 1-2 2H11l-5 4.2v-4.2H4.5a2 2 0 0 1-2-2V5.5a2 2 0 0 1 2-2z" fill="currentColor"/></svg><span class="label" data-ui="newPrompt">New prompt</span></button>
  </div>
  <div class="deal-row scenes" id="scenesWrap" hidden>
    <div class="sounds"><button id="sceneBuzz" class="buzz" aria-label="Buzzer" data-ui-aria="buzzer"><svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg></button><button class="bell" aria-label="Bell" data-ui-aria="bell"><svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><rect x="9.4" y="4.2" width="5.2" height="1.8" rx=".9" fill="currentColor"/><rect x="11.2" y="5.6" width="1.6" height="2.6" fill="currentColor"/><path d="M4.6 16.6a7.4 7.4 0 0 1 14.8 0z" fill="currentColor"/><rect x="2.8" y="17.6" width="18.4" height="2.4" rx="1.2" fill="currentColor"/></svg></button></div>
    <button class="deal" id="dealScene" disabled aria-label="New scene" data-ui-aria="newScene"><svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><rect x="2" y="3" width="20" height="2.6" rx="1" fill="currentColor"/><path d="M2.5 5.6h8c-.3 3.4-2 6.2-4.8 8.1 1.2 2 1.9 4.2 2 6.3H2.5z" fill="currentColor"/><path d="M21.5 5.6h-8c.3 3.4 2 6.2 4.8 8.1-1.2 2-1.9 4.2-2 6.3h5.2z" fill="currentColor"/><path d="M2 21h20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span class="label" data-ui="newScene">New scene</span></button>
  </div>
  <div class="deal-row games" id="gamesWrap" hidden>
    <div class="sounds"><button id="gameBuzz" class="buzz" aria-label="Buzzer" data-ui-aria="buzzer"><svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg></button><button class="bell" aria-label="Bell" data-ui-aria="bell"><svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><rect x="9.4" y="4.2" width="5.2" height="1.8" rx=".9" fill="currentColor"/><rect x="11.2" y="5.6" width="1.6" height="2.6" fill="currentColor"/><path d="M4.6 16.6a7.4 7.4 0 0 1 14.8 0z" fill="currentColor"/><rect x="2.8" y="17.6" width="18.4" height="2.4" rx="1.2" fill="currentColor"/></svg></button></div>
    <button class="deal" id="dealGame" disabled aria-label="New game" data-ui-aria="newGame"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><rect x="3.2" y="5.2" width="11" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.9" transform="rotate(-10 8.7 12.7)"/><rect x="9.6" y="3.4" width="11" height="15" rx="2" fill="currentColor" transform="rotate(8 15.1 10.9)"/></svg><span class="label" data-ui="newGame">New game</span></button>
  </div>
</div>
<div class="status" id="status"></div>
<div class="reveal" id="reveal" role="dialog" aria-modal="true" hidden>
  <div class="who" id="revealKind"></div>
  <p id="revealText"></p>
  <div class="hint" data-ui="tapClose">Tap to close</div>
</div>
<script src="player.js"></script>
</body>
</html>
